; Настройки Murdrum farm bot.
; Все координаты — ВНУТРИ окна игры (клиентская область), снимай их через F10 / Ctrl+Alt+C.
; Шаги (Steps) пишутся через ";":  click:x,y  rclick:x,y  walk:x,y,ms  key:{F1}  type:текст  cmd:/move arena  wait:ms  activate

[Game]
; Как найти окно клиента (ahk_exe <имя exe> или заголовок окна)
Window=ahk_exe main.exe
Exe=main.exe
; Полный путь к лаунчеру или main.exe — нужен для перезахода после дисконнекта
Launcher=C:\Games\Murdrum\Launcher.exe
; Клики в лаунчере (например, кнопка «Играть»). Пусто, если запускаешь main.exe напрямую
LauncherSteps=click:500,420
LauncherWait=90000
Login=
Password=
; Вход: выбор сервера, логин, пароль, выбор персонажа. {LOGIN} и {PASS} берутся из полей выше
LoginSteps=wait:8000; click:400,300; wait:2000; click:400,250; type:{LOGIN}; key:{Tab}; type:{PASS}; key:{Enter}; wait:5000; click:300,350; key:{Enter}; wait:8000
; Пауза перед новой попыткой, если вход не удался
ReconnectPause=30000

[Farm]
; 1 = при старте сразу идти на спот, 0 = персонаж уже стоит на споте
GoToSpotOnStart=0
; hold = держать правую кнопку мыши в точке AttackX/AttackY; click = кликать правой каждые RClickEvery мс; none = не бить мышью
AttackMode=hold
AttackX=400
AttackY=260
RClickEvery=700
; Клавиша скилла (например {F1} или 2), пусто — не нажимать
SkillKey=
SkillEvery=1000
; Подбор шмота из-под персонажа
PickupKey={Space}
PickupEvery=3000
PickupPresses=3
; Как часто открывать инвентарь и выбрасывать мусор (мс)
CleanEvery=60000

[Inventory]
Key=v
; X,Y — левый верхний угол ПЕРВОЙ ячейки, CellW/CellH — размер ячейки
X=0
Y=0
CellW=20
CellH=20
Cols=8
Rows=8
; Допуск цвета пустой ячейки и допуск поиска картинок
Tolerance=14
ImageTol=40
; keep = оставлять ТОЛЬКО вещи из папки keep\ (камни), остальное выбрасывать
; junk = выбрасывать ТОЛЬКО вещи из папки junk\, остальное оставлять
Mode=keep
; Если свободных ячеек меньше — нести всё в сундук
MinFree=4
; Куда кликнуть, чтобы бросить вещь на землю (вне окна инвентаря)
DropX=200
DropY=260
; Что сделать после выброса (например, отойти, чтобы Space не поднял мусор снова)
AfterDropSteps=

[Vault]
; Путь от респауна/спота до сундука и его открытие. Должен заканчиваться открытым сундуком.
Steps=cmd:/move lorencia; wait:4000; walk:300,200,3000; click:350,180; wait:1500
CloseSteps=key:{Esc}
X=0
Y=0
CellW=20
CellH=20
Cols=8
Rows=15
Tolerance=14

[Health]
; Точка на сфере HP, которая красная, пока персонаж жив
X=0
Y=0
; Цвет этой точки у живого персонажа, например 0xC01010. Пусто — смерть не отслеживается
Color=
Tolerance=40
RespawnWait=8000

[Spots]
; Если умер DeathsToSwitch раз за DeathWindowMin минут — переходить на следующий спот
DeathsToSwitch=2
DeathWindowMin=10

[Disconnect]
; Картинка окна «соединение потеряно» (png рядом со скриптом). Пусто — проверяется только закрытие окна
Image=
CheckEvery=5000

; Споты для фарма: путь от респауна до точки фарма
[Spot1]
Name=Dungeon 2
Steps=cmd:/move dungeon; wait:4000; walk:600,200,2500; walk:600,200,2500

[Spot2]
Name=Lost Tower
Steps=cmd:/move losttower; wait:4000; walk:200,350,2500

; Записываются автоматически кнопками F11 / Ctrl+F11
[InventoryEmpty]
Colors=

[VaultEmpty]
Colors=
